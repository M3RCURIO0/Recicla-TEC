<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!---links para logotipo favicon--->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="shortcut icon" href="./Recicla/fav com/favicon-16x16.png" type="image/x-icon">
<link rel="stylesheet" href="style.css">

    <title>ReciclaTec-Ceep</title>
</head>
<body>
    <header>
        <div class="logo">
            <h2>ReciclaTec-Ceep</h2>
        </div>
        <nav>
            <a href="https://ceepcianorte.com.br">Início</a>
            <a href="#">Cursos</a>
            <a href="">E-Lixo (Descarte)</a>
        </nav>
    </header>
    <div class="hero">
        <h1>Campanha de descarte de Lixo Eletrônico</h1>
        <p>Ajude o meio ambiente e o nosso colégio.
            Cadastre o equipamento que você deseja doar ou descartar!
        </p>
    </div>
    <div class="container">
        <h2>Formulário de Cadastro de E-Lixo</h2>
        <form action="/processar-descartar.php" method="post">
            <label for="nome">Seu Nome (Aluno/Professor/Comunidade)</label>
            <input type="text" id="nome" name="nome" required>

            <label for="contrato">E-mail ou WhatsApp</label> 
            <input type="text" id="contato" name="contato" required>

            <label for="tipo_equipamento">Tipo de equipamento</label>
            <select name="tipo_equipamento" id="tipo_equipamento">
                <option value="Selecionar..."></option>
                <option value="Computador">Computador / Notebook</option>
                <option value="Celulares">Celulares / Tablets</option>
                <option value="Perifericos">Periféricos (Teclados, Mouse, Cabos...)</option>
                <option value="Baterias">Pilhas e Baterias</option>
                <option value="Outros">Outros (Espefique abaixo.)</option>

            </select>

            <label for="estado">Estado do Equipamento:</label> 
            <select name="estado" id="estado" required>
                <option value="funcionando">Funcionando (DOAÇÃO)</option>
                <option value="estragado">Estragado (Descarte / Reciclagem)</option>
                <option value="parcial">Funcionando parcialmente (Pode render peças)</option>

            </select>           

            <label for="descricao">Descrição do produto (Marca / Modelo / Problemas, se hover, etc)</label>
            <textarea name="descricap" id="descricao" rows="4"></textarea>

            <button type="submit">Registrar Equipamento</button>
        </form>
        
    </div>
</body>
</html>
